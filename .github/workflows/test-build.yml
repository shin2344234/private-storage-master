# Test and diagnostic builds, published as GitHub prereleases.
#
# Push a tag named v<version>-test<N> or v<version>-diag<N>, push a branch
# commit that adds or changes docs/test-builds/<that tag>.md, or run it by hand
# (workflow_dispatch, which GitHub offers only once this file is on the default
# branch) with that tag name as input, and this builds the
# plugin with MSVC on a Windows runner, packages the same two archives
# mod/scripts/package.ps1 makes (the full zip and the DMM zip), and publishes a
# prerelease for the tag with the notes in docs/test-builds/<tag>.md.
#
# A -diag tag builds with -DPSM_DIAG=ON (see core/diag.h): every log line on
# whatever the ini says, plus the diagnostic probes. A -test tag builds the
# plugin as it ships. Neither is a release: they are not signed, not on Nexus,
# and the release scripts (publish-github.ps1, publish-nexus.ps1) are never
# run from here. Real releases still go through those, from Seth's machine.
name: test build

on:
  # A branch push that touches a notes file: the notes file names the tag.
  # For when a tag cannot be pushed; the cloud session that cut 1.1.10-diag1
  # could push its branch but not tags, and could not dispatch a workflow that
  # was not on the default branch yet. The release step then creates the tag
  # itself, on the commit this run built.
  # Tags are not filtered by paths (GitHub never applies paths to tag pushes).
  push:
    tags:
      - "v*-test*"
      - "v*-diag*"
    branches:
      - "**"
    paths:
      - "docs/test-builds/v*.md"
  # By hand, the same, once this workflow is on the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, v<version>-diag<N> or v<version>-test<N>"
        required: true

permissions:
  contents: write   # to create the prerelease and upload its files

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the branch-push path diffs against the commit before the push

      - name: Find the tag
        shell: pwsh
        run: |
          # The pushed tag, the input of a manual run, or for a branch push the
          # one notes file under docs/test-builds that the push added or changed.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ inputs.tag }}" }
          elseif ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          else {
            $before = "${{ github.event.before }}"
            # A new branch has no "before" (all zeros): compare with its parent.
            if ($before -match '^0+$') { $before = "${{ github.sha }}~1" }
            $files = @(git diff --name-only --diff-filter=AM $before ${{ github.sha }} -- 'docs/test-builds/v*.md')
            if ($files.Count -ne 1) { throw "a branch push must change exactly one docs/test-builds notes file, this one changed: $($files -join ', ')" }
            $tag = [IO.Path]::GetFileNameWithoutExtension($files[0])
          }
          "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "publishing $tag"

      # Puts cl, link, rc and nmake on PATH, the same as vcvars64.bat in build.bat.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Work out the build from the tag
        id: tag
        shell: pwsh
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+-(diag|test)\d+$') { throw "$tag is not a v<version>-diag<N> or -test<N> tag" }
          # v1.1.10-diag1 -> version 1.1.10-diag1, suffix -diag1
          $version = $tag.TrimStart('v')
          $diag = $tag -match '-diag\d+$'
          $suffix = if ($tag -match '(-(?:diag|test)\d+)$') { $Matches[1] } else { '' }
          # The released number in version.h must be the part before the suffix,
          # so a test build can never claim to be a version it was not cut from.
          $header = Get-Content mod/src/version.h -Raw
          if ($header -notmatch '#define PSM_VERSION\s+"([^"]+)"') { throw "PSM_VERSION not found in version.h" }
          $base = $Matches[1]
          if ($version -ne "$base$suffix") { throw "tag $tag does not match PSM_VERSION $base plus $suffix" }
          if (-not (Test-Path "docs/test-builds/$tag.md")) { throw "docs/test-builds/$tag.md, the release notes, is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "diag=$(if ($diag) { 'ON' } else { 'OFF' })" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: >
          cmake -S mod -B mod/build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DPSM_DIAG=${{ steps.tag.outputs.diag }} -DPSM_DIAG_TAG=${{ steps.tag.outputs.suffix }}
          -DPSM_DEPOSIT_TEST_KEY=OFF

      - name: Build
        shell: pwsh
        run: cmake --build mod/build

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          # The same layout as package.ps1: the full zip carries the plugin, the
          # mod README, the licence and the notices; the DMM zip the plugin and
          # the licence and notices renamed after the plugin, because DMM unpacks
          # every mod into one folder.
          $v = "${{ steps.tag.outputs.version }}"
          $asi = "mod/dist/PrivateStorageMaster.asi"
          if (-not (Test-Path $asi)) { throw "$asi was not built" }
          New-Item -ItemType Directory -Force out | Out-Null
          $full = "out/PrivateStorageMaster-$v.zip"
          $dmm = "out/PrivateStorageMaster-$v-DMM.zip"

          $s = Join-Path $env:RUNNER_TEMP "full"
          New-Item -ItemType Directory -Force $s | Out-Null
          Copy-Item $asi, mod/README.md, LICENSE, THIRD_PARTY_NOTICES.md $s
          Compress-Archive -Path "$s/*" -DestinationPath $full

          $s = Join-Path $env:RUNNER_TEMP "dmm"
          New-Item -ItemType Directory -Force $s | Out-Null
          Copy-Item $asi $s
          Copy-Item LICENSE (Join-Path $s "PrivateStorageMaster-LICENSE")
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $s "PrivateStorageMaster-THIRD_PARTY_NOTICES.md")
          Compress-Archive -Path "$s/*" -DestinationPath $dmm

          Copy-Item $asi out/

          # Release notes: the tag's notes file, then the checksums of what was
          # built here, which only this job can know.
          $notes = "out/notes.md"
          Get-Content "docs/test-builds/$($env:TAG).md" -Raw | Set-Content $notes -NoNewline
          Add-Content $notes "`n## Checksums`n"
          Add-Content $notes "Built by GitHub Actions from commit ${{ github.sha }}. Not code-signed, unlike the Nexus releases.`n"
          foreach ($f in @($dmm, $full, "out/PrivateStorageMaster.asi")) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            Add-Content $notes ("    {0}  {1}" -f $h, (Split-Path $f -Leaf))
          }
          Get-Content $notes

      - uses: softprops/action-gh-release@v2
        with:
          # Created on the built commit when it does not exist yet (a manual run).
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Private Storage Master ${{ steps.tag.outputs.version }} (${{ steps.tag.outputs.diag == 'ON' && 'diagnostic build' || 'test build' }})
          body_path: out/notes.md
          prerelease: true
          files: |
            out/PrivateStorageMaster-${{ steps.tag.outputs.version }}.zip
            out/PrivateStorageMaster-${{ steps.tag.outputs.version }}-DMM.zip
            out/PrivateStorageMaster.asi
